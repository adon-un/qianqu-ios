name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 组装原生抠图插件
        run: |
          mkdir -p plugins/subject-cutout/ios/Sources
          cp SubjectCutoutPlugin.swift plugins/subject-cutout/ios/Sources/
                              python3 -c "import base64,pathlib;p=pathlib.Path('plugins/subject-cutout');(p/'package.json').write_bytes(base64.b64decode('ewogICJuYW1lIjogInN1YmplY3QtY3V0b3V0IiwKICAidmVyc2lvbiI6ICIxLjAuMCIsCiAgImZpbGVzIjogWyJpb3MiXSwKICAiY2FwYWNpdG9yIjogeyAiaW9zIjogeyAic3JjIjogImlvcyIgfSB9LAogICJwZWVyRGVwZW5kZW5jaWVzIjogeyAiQGNhcGFjaXRvci9jb3JlIjogIl43LjAuMCIgfQp9'));(p/'SubjectCutout.podspec').write_bytes(base64.b64decode(''))"
          find plugins -type f

      - name: 安装依赖
        run: npm install

      - name: 准备网页资源
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-180.png icon-192.png icon-512.png www/

      - name: 生成 iOS 工程
        run: npx cap add ios

      - name: 同步网页到原生壳
        run: npx cap sync ios

      - name: 确保抠图插件进 Podfile
        run: |
          cd ios/App
          if ! grep -q "SubjectCutout" Podfile; then
            perl -0pi -e "s/capacitor_pods/capacitor_pods\n  pod 'SubjectCutout', :path => '..\/..\/plugins\/subject-cutout'/" Podfile
            echo "已手动把 SubjectCutout 写进 Podfile"
          else
            echo "cap sync 已自动加入 SubjectCutout"
          fi
          grep -n "SubjectCutout" Podfile

      - name: 安装 Pods
        run: |
          cd ios/App
          pod install --repo-update

      - name: 检查插件是否链接
        run: |
          cd ios/App
          if grep -q "SubjectCutout" Podfile.lock; then
            echo "✅ SubjectCutout 已链接"
          else
            echo "::warning::SubjectCutout 未链接，抠图会退回本地算法"
          fi

      - name: 编译（不签名）
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: 打包成 ipa
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr qianqu-unsigned.ipa Payload

      - name: 检查插件是否编进 App
        run: |
          if [ -d "Payload/App.app/Frameworks/SubjectCutout.framework" ]; then
            echo "✅ 原生抠图插件已打进 App"
          else
            ls Payload/App.app/Frameworks/ || true
            echo "::warning::没找到 SubjectCutout.framework"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: qianqu-ipa
          path: qianqu-unsigned.ipa
          retention-days: 7
